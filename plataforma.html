<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plataforma — Painel Multilogin</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="index.html">← Voltar às categorias</a>

    <div class="platform-header">
      <div id="icon" class="tile-icon" style="background:#2dd4a7"></div>
      <h1 id="nome">Carregando…</h1>
    </div>

    <div id="lista" class="account-list">
      <p class="state-msg">Carregando contas…</p>
    </div>

    <p id="dest" class="dest-link" style="display:none">
      Link de destino desta plataforma: <code id="dest-url"></code>
    </p>
  </div>

  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const aba = params.get("aba");

    async function carregar() {
      const lista = document.getElementById("lista");
      if (!aba) {
        lista.innerHTML = `<p class="error-msg">Plataforma não informada na URL.</p>`;
        return;
      }

      try {
        const [plataformas, contas] = await Promise.all([
          fetchJSON("/api/plataformas"),
          fetchJSON(`/api/contas?aba=${encodeURIComponent(aba)}`),
        ]);

        const info = plataformas.find((p) => p.aba === aba);
        if (info) {
          document.getElementById("nome").textContent = info.nome;
          document.getElementById("icon").style.background = info.cor || "#2dd4a7";
          if (info.link) {
            document.getElementById("dest").style.display = "block";
            document.getElementById("dest-url").textContent = info.link;
          }
        }

        if (contas.length === 0) {
          lista.innerHTML = `<p class="state-msg">Nenhuma conta cadastrada nesta plataforma.</p>`;
          return;
        }

        lista.innerHTML = contas
          .map(
            (c, i) => `
          <div class="account-row">
            <div>
              <div class="account-name">${c["nome aluno"] || "Sem nome"}</div>
              <div class="account-meta">${c["id da plataforma"] || ""}</div>
            </div>
            <button class="access-btn" data-i="${i}">Acessar</button>
          </div>`
          )
          .join("");

        lista.querySelectorAll(".access-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const c = contas[btn.dataset.i];
            acessarConta({
              id: c["id da plataforma"],
              senha: c["senha"],
              link: info ? info.link : null,
            });
          });
        });
      } catch (err) {
        lista.innerHTML = `<p class="error-msg">Não foi possível carregar as contas: ${err.message}</p>`;
      }
    }
    carregar();
  </script>
</body>
</html>
